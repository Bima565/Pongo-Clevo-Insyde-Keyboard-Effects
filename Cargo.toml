[package]
name = "pongo-keyboard-effects"
version = "2.0.0"
edition = "2021"
authors = ["Bima565"]
description = "High-performance Rust RGB keyboard lighting controller for Clevo / Axioo Pongo laptops"

[lib]
name = "pongo_effects"
path = "src/lib.rs"

[[bin]]
name = "CppKeyboardColour"
path = "src/bin/cli.rs"

[[bin]]
name = "KeyboardEffectsUI"
path = "src/bin/ui.rs"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse"
] }
